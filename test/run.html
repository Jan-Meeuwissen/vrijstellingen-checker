<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Testresultaten — Vrijstellingen-checker</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  #score { font-size: 1.2rem; font-weight: bold; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
  #score.alles-geslaagd { background: #d4f4dd; color: #1a4d2e; }
  #score.er-zijn-fouten { background: #fbdada; color: #6b1414; }
  .geval { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .geval.geslaagd { border-left: 6px solid #2e7d32; }
  .geval.gezakt { border-left: 6px solid #c62828; background: #fff5f5; }
  .geval h3 { margin: 0 0 0.25rem; font-size: 1rem; }
  .status { font-weight: bold; }
  .geslaagd .status { color: #2e7d32; }
  .gezakt .status { color: #c62828; }
  .details { font-size: 0.9rem; color: #444; }
  button { margin-top: 0.5rem; font-size: 0.85rem; cursor: pointer; }
  .pad { margin-top: 0.5rem; font-size: 0.85rem; background: #f5f5f5; padding: 0.5rem 0.75rem; border-radius: 6px; display: none; }
  .pad.open { display: block; }
  .pad ol { margin: 0.25rem 0 0; padding-left: 1.25rem; }
  code { background: #eee; padding: 0 0.25rem; border-radius: 3px; }
</style>
</head>
<body>
<h1>Testresultaten — Vrijstellingen-checker</h1>
<p>Draait de 32 testgevallen uit §12.1 van de bouwopdracht door <code>bepaal()</code> uit
<code>js/engine.js</code>, met de regels uit <code>js/regels.js</code>. Geen testframework nodig
— open dit bestand gewoon via een lokale server.</p>
<div id="score"></div>
<div id="gevallen"></div>

<script src="../js/regels.js"></script>
<script src="../js/engine.js"></script>
<script src="cases.js"></script>
<script>
(function () {
  const data = window;
  const container = document.getElementById('gevallen');
  let geslaagd = 0;

  TESTGEVALLEN.forEach((geval) => {
    const { pad, resultaat } = simuleerPad(geval.antwoorden, data);
    const gekregen = resultaat.type === 'uitkomst' ? resultaat.uitkomst : `(geen uitkomst — nog vraag "${resultaat.vraag}")`;
    let ok = resultaat.type === 'uitkomst' && resultaat.uitkomst === geval.verwacht;
    const extraProblemen = [];

    if (geval.controleerGeenVeld) {
      const gevraagd = pad.filter((p) => geval.controleerGeenVeld.includes(p.veld));
      if (gevraagd.length > 0) {
        ok = false;
        extraProblemen.push(`Deze vraag had niet gesteld mogen worden: ${gevraagd.map((p) => p.veld).join(', ')}`);
      }
    }
    if (geval.controleerVangnet && resultaat.viaVangnet !== true) {
      ok = false;
      extraProblemen.push('Verwacht dat dit via het vangnet (§6.2) zou lopen, maar dat gebeurde niet.');
    }

    if (ok) geslaagd += 1;

    const div = document.createElement('div');
    div.className = 'geval ' + (ok ? 'geslaagd' : 'gezakt');
    const uitleg = geval.toelichting ? ` <em>(${geval.toelichting})</em>` : '';
    div.innerHTML = `
      <h3>#${geval.nr} — ${geval.omschrijving}${uitleg}</h3>
      <div class="status">${ok ? '✔ geslaagd' : '✘ gezakt'}</div>
      <div class="details">
        Verwacht uitkomst: <code>${geval.verwacht}</code> —
        Gekregen: <code>${gekregen}</code>${resultaat.viaVangnet ? ' <em>(via vangnet)</em>' : ''}
        ${extraProblemen.length ? '<br>' + extraProblemen.map((p) => '⚠ ' + p).join('<br>') : ''}
      </div>
      <button type="button">Toon het gestelde vragenpad</button>
      <div class="pad">
        <ol>
          ${pad.map((p) => `<li><strong>${p.vraag}</strong> (veld: <code>${p.veld}</code>) → gegeven: <code>${JSON.stringify(p.gegeven)}</code></li>`).join('')}
        </ol>
        ${resultaat.type === 'uitkomst' && resultaat.regel ? `<p>Toegepaste regel: <code>${resultaat.regel.id}</code><br>Bron: ${resultaat.regel.bron}</p>` : ''}
      </div>
    `;
    const knop = div.querySelector('button');
    const padDiv = div.querySelector('.pad');
    knop.addEventListener('click', () => padDiv.classList.toggle('open'));
    container.appendChild(div);
  });

  const scoreDiv = document.getElementById('score');
  const totaal = TESTGEVALLEN.length;
  scoreDiv.textContent = `${geslaagd} van de ${totaal} testgevallen geslaagd`;
  scoreDiv.className = geslaagd === totaal ? 'alles-geslaagd' : 'er-zijn-fouten';
})();
</script>
</body>
</html>
